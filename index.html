<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b1220">
<title>洗碗机 · 外网控制台</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;padding:20px 14px 34px;
 background:radial-gradient(1200px 600px at 50% -10%,#16233f 0%,#0b1220 55%,#070c16 100%);
 font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#e8eef7;min-height:100vh;}
.wrap{max-width:420px;margin:0 auto;}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.hd .t{font-size:17px;font-weight:700;letter-spacing:.5px;}
.hd .net{font-size:11px;color:#5f7599;letter-spacing:.5px;}
.reset{margin-left:8px;font-size:12px;color:#60a5fa;cursor:pointer;user-select:none;}
.reset:hover{color:#93c5fd;text-decoration:underline;}
.dot{width:10px;height:10px;border-radius:50%;background:#5b6b86;display:inline-block;}
.dot.wait{background:#ffc24b;box-shadow:0 0 10px #ffc24b;animation:pu 1s infinite;}
.dot.ok{background:#39d98a;box-shadow:0 0 10px #39d98a;animation:pu 1.6s infinite;}
.dot.err{background:#ff5c5c;box-shadow:0 0 10px #ff5c5c;}
@keyframes pu{50%{opacity:.35;}}

/* 只在需要用户填写时才出现 */
.uidbar{display:none;margin-bottom:14px;padding:13px;border-radius:14px;
 background:rgba(255,193,7,.07);border:1px solid rgba(255,193,7,.28);}
.uidbar .lt{font-size:12.5px;color:#ffd35e;line-height:1.7;margin-bottom:9px;}
.uidbar .rw{display:flex;gap:8px;}
.uidbar input{flex:1;min-width:0;padding:11px 12px;border-radius:11px;border:1px solid #25344f;
 background:#0f1a2e;color:#e8eef7;font-size:13px;outline:none;}
.uidbar input:focus{border-color:#2f7fd6;}
.uidbar button{padding:0 16px;border-radius:11px;border:1px solid #2a6b4a;
 background:linear-gradient(180deg,#1fd38b,#0da568);color:#03271a;font-weight:700;font-size:14px;cursor:pointer;flex-shrink:0;}
.uidbar button:active{transform:scale(.97);}

.screen{position:relative;border-radius:22px;padding:30px 16px 24px;text-align:center;
 background:linear-gradient(165deg,#12203a 0%,#0a1322 60%,#081020 100%);
 box-shadow:inset 0 0 30px rgba(0,229,255,.06),inset 0 1px 0 rgba(255,255,255,.06),0 12px 30px rgba(0,0,0,.55),0 0 0 1px #1c2a47;}
.screen::after{content:"";position:absolute;left:6%;right:6%;top:0;height:45%;
 border-radius:22px 22px 60% 60%;background:linear-gradient(180deg,rgba(255,255,255,.07),transparent);pointer-events:none;}
.lb{font-size:12px;color:#6d84ab;letter-spacing:3px;margin-bottom:12px;}
.remain{font-family:Consolas,Menlo,monospace;font-size:40px;font-weight:700;color:#5ef2c0;
 text-shadow:0 0 22px rgba(94,242,192,.5);letter-spacing:1px;}
.st{margin-top:14px;font-size:13px;color:#8fa6cc;background:rgba(255,255,255,.04);display:inline-block;
 padding:6px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.06);
 max-width:96%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.row2{display:flex;gap:12px;margin-top:14px;}
.pw,.pz{flex:1;display:block;padding:13px;border-radius:14px;font-size:15.5px;font-weight:600;cursor:pointer;
 box-shadow:0 6px 16px rgba(0,0,0,.4);transition:transform .12s,background .2s,box-shadow .2s;}
.pw{color:#bff7d6;background:linear-gradient(180deg,#143a26,#0f2a1c);border:1px solid #226b45;}
.pw.on{color:#03271a;background:linear-gradient(180deg,#1fd38b,#0da568);border-color:#43eeae;
 box-shadow:0 0 20px rgba(43,230,158,.45),0 6px 14px rgba(0,0,0,.35);}
.pz{color:#ffe9b8;background:linear-gradient(180deg,#3a2f14,#2a220f);border:1px solid #6b5a22;}
.pz.rz{color:#bfe9ff;background:linear-gradient(180deg,#12304a,#0c2135);border-color:#1f5c86;}
.pw:active,.pz:active{transform:scale(.98);}

/* 历史日志按钮：独立蓝色按钮，避免被 .pz 的属性覆盖 */
.btnlog{flex:1;width:100%;display:block;padding:13px;border-radius:14px;font-size:15.5px;font-weight:600;
 cursor:pointer;color:#ffffff;border:1px solid #60a5fa;
 background:linear-gradient(180deg,#3b82f6,#2563eb);
 box-shadow:0 6px 16px rgba(37,99,235,.45),inset 0 1px 0 rgba(255,255,255,.22);
 transition:transform .12s,box-shadow .2s,filter .2s;}
.btnlog:hover{filter:brightness(1.08);}
.btnlog:active{transform:scale(.98);box-shadow:0 3px 10px rgba(37,99,235,.4);}

.lock{margin-top:14px;padding:11px;border-radius:12px;background:rgba(255,193,7,.08);
 border:1px solid rgba(255,193,7,.3);color:#ffd35e;font-size:13px;text-align:center;display:none;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;}
.bt{position:relative;border-radius:16px;padding:15px 8px 12px;border:1px solid #22304d;
 background:linear-gradient(180deg,#182642,#111b2f);color:#9db1d1;font-size:16px;font-weight:600;
 box-shadow:0 5px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);
 transition:transform .12s,background .2s,box-shadow .2s;cursor:pointer;}
.bt:active{transform:scale(.95);}
.bt .n{display:block;font-size:11px;font-weight:400;color:#5f7599;margin-top:5px;letter-spacing:1px;}
.bt.on{background:linear-gradient(180deg,#1fd38b,#0da568);border-color:#43eeae;color:#03271a;
 box-shadow:0 0 20px rgba(43,230,158,.45),0 6px 14px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35);}
.bt.on .n{color:#0b4d31;}
.bt.pump{border-color:#2a4a6e;}
.bt.pump.on{background:linear-gradient(180deg,#39a7ff,#1d7fd6);border-color:#7cc4ff;color:#032542;
 box-shadow:0 0 20px rgba(57,167,255,.5),0 6px 14px rgba(0,0,0,.35);}
.tip{margin-top:16px;font-size:12px;color:#5f7599;line-height:1.8;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <span class="t">🍽 洗碗机 · 外网控制台</span>
    <span><span class="net" id="net">公网</span> <span class="dot" id="dot"></span> <span class="reset" id="resetUid" onclick="resetUid()" title="清除已保存的巴法云ID（换设备/重新填写）" style="display:none;">⟳ 换设备</span></span>
  </div>

  <div class="uidbar" id="uidbar">
    <div class="lt" id="uidtip">首次使用，请填写巴法云 UID（只需一次，之后自动记住）</div>
    <div class="rw">
      <input id="uid" placeholder="粘贴巴法云 UID" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button onclick="manualConnect()">连接</button>
    </div>
  </div>

  <div class="screen">
    <div class="lb">REMAINING TIME · 剩余时间</div>
    <div class="remain" id="remain">-- --</div>
    <div class="st" id="st">正在寻找设备…</div>
    <div id="debug" style="margin-top:10px;padding:8px;background:#1a1a2e;color:#0f0;font-size:11px;border-radius:6px;max-height:80px;overflow:auto;text-align:left;"></div>
  </div>

  <div class="row2">
    <button class="pw" id="pw" onclick="doPower()">⏻ 开机</button>
    <button class="pz" id="pz" onclick="doPause()">⏸ 暂停</button>
  </div>

  <div class="row2" style="margin-top:12px;">
    <button class="btnlog" onclick="openCalendar()">📅 历史日志</button>
  </div>

  <!-- 日历弹窗 -->
  <div id="calendarModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.72);z-index:1000;justify-content:center;align-items:center;padding:16px;box-sizing:border-box;">
    <div style="background:#fff;border-radius:16px;padding:20px;width:100%;max-width:380px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.5);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <button onclick="prevMonth()" style="background:#f3f4f6;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;">←</button>
        <div id="calendarTitle" style="font-size:18px;font-weight:700;color:#333;">2026年10月</div>
        <button onclick="nextMonth()" style="background:#f3f4f6;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;">→</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-bottom:10px;">
        <div style="font-size:12px;color:#999;padding:4px;">日</div>
        <div style="font-size:12px;color:#999;padding:4px;">一</div>
        <div style="font-size:12px;color:#999;padding:4px;">二</div>
        <div style="font-size:12px;color:#999;padding:4px;">三</div>
        <div style="font-size:12px;color:#999;padding:4px;">四</div>
        <div style="font-size:12px;color:#999;padding:4px;">五</div>
        <div style="font-size:12px;color:#999;padding:4px;">六</div>
      </div>
      <div id="calendarDays" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;">
      </div>
      <div id="logDiag" style="margin-top:10px;font-size:12px;color:#b26a00;background:#fff8e1;border-radius:8px;padding:8px;line-height:1.5;"></div>
      <div style="margin-top:16px;">
        <div id="logContent" style="background:#f9fafb;border-radius:8px;padding:12px;min-height:100px;font-size:13px;color:#333;white-space:pre-wrap;font-family:Consolas,monospace;">
          点击有记录的日期查看日志
        </div>
      </div>
      <div style="margin-top:16px;text-align:center;">
        <button onclick="closeCalendar()" style="background:#6b7280;color:#fff;border:none;padding:10px 30px;border-radius:8px;cursor:pointer;font-size:14px;">关闭</button>
      </div>
    </div>
  </div>

  <div class="lock" id="lock">🔒 自动流程运行中，单路开关已锁定</div>
  <div class="grid" id="grid"></div>
  <div class="tip">公网直连（手机流量可用）· 走巴法云 WebSocket 转发<br>水泵保护：① 进水满3秒后开泵　② 或 水循环+水位已满</div>
</div>

<script>
/* ============================================================
   主题定义（与固件 / 巴法APP 完全一致）
   关键：网页直接订阅【巴法APP 在用的原生主题】——
         xiwanjitime004(倒计时) / xiwanji0x006(8路) / xiwanjizt(状态)。
   这些主题已被巴法APP 验证可用（APP 里的执行/剩余/暂停剩余都来自这里），
   网页订阅同一组即可实时收到；不再依赖自定义快照（实测无法稳定送达）。
   ============================================================ */
var TOPIC_REMAIN = "xiwanjitime004";   // 倒计时：设备每2秒上报，与巴法APP 同一个传感器
var TOPIC_STATUS = "xiwanjizt";       // 状态文字
var TOPIC_CMD    = "xiwanji001";      // 网页→设备：开关机
var TOPIC_PAUSE  = "xiwanjipause006"; // 网页→设备：暂停/恢复
var TOPIC_LOG    = "xiwanjilog";      // 日志查询主题
function chTopic(i){ return "xiwanji" + ("0"+(i+1)).slice(-2) + "006"; }

/* ============================================================ 状态 ============================================================ */
var names=["进水","循环水","下喷淋","上喷淋","排水阀","水泵","备用 7","备用 8"];
var ch=[0,0,0,0,0,0,0,0], run=0, paused=0, auto=0, busy=0;
var client=null, demo=false, hadUid=false;
var LSK='bemfa_uid', CK='bemfa_uid_v1', uid='';

/* 主题名 → 通道序号（去掉 /up、/set 后缀后匹配） */
var chBase={};
for(var i=0;i<8;i++){ chBase[chTopic(i)] = i; }
function baseTopic(t){ if(t.endsWith('/up')||t.endsWith('/set')) return t.slice(0,-3); return t; }

/* 永久记住 UID：localStorage(主) + Cookie(10年, 备用双保险)。
   除非用户手动清除浏览器存储/网站数据，否则一直保留，每次打开自动连接。 */
function saveUid(id){
  id=(id||'').trim(); if(!id) return;
  try{ localStorage.setItem(LSK, id); }catch(e){}
  try{
    var exp=new Date(Date.now()+10*365*24*3600*1000).toUTCString();
    document.cookie=CK+'='+encodeURIComponent(id)+'; expires='+exp+'; path=/; SameSite=Lax';
  }catch(e){}
}
function loadUid(){
  try{ var v=localStorage.getItem(LSK); if(v&&v.trim()) return v.trim(); }catch(e){}
  try{
    var m=document.cookie.match(new RegExp('(?:^|; )'+CK.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'=([^;]*)'));
    if(m&&m[1]){ var c=decodeURIComponent(m[1]); if(c.trim()) return c.trim(); }
  }catch(e){}
  return '';
}

var g=document.getElementById('grid');
for(var i=0;i<8;i++){
  var b=document.createElement('button');
  b.className='bt'+(i==5?' pump':''); b.id='b'+i;
  b.innerHTML=names[i]+'<span class="n">CH'+(i+1)+' · 关</span>';
  b.onclick=(function(k){return function(){toggle(k);};})(i);
  g.appendChild(b);
}

/* ============================================================ 渲染 ============================================================ */
function setDot(s){ document.getElementById('dot').className='dot'+(s===2?' ok':(s===1?' wait':(s===3?' err':''))); }

/* 倒计时文本来自巴法APP 同款传感器主题；并据此推导运行/暂停状态 */
function setRemain(s){
  document.getElementById('remain').innerText = (s && s.length) ? s : '-- --';
  // “待机”=未运行； “剩余XX分XX秒”=运行中； “已暂停，剩余XX分XX秒”=已暂停
  var running  = !!(s && s!=='待机');
  var isPaused = !!(s && s.indexOf('已暂停')>=0);
  run = running ? 1 : 0;
  paused = isPaused ? 1 : 0;
  auto = (!demo) && run && !paused;   // 自动流程运行中 → 锁定单路开关
  updateUI();
}
function setCh(i, on){
  if(i<0||i>7) return;
  ch[i]= on?1:0;
  var bt=document.getElementById('b'+i);
  bt.classList.toggle('on',!!ch[i]);
  bt.querySelector('.n').innerText='CH'+(i+1)+' · '+(ch[i]?'开':'关');
}
function updateUI(){
  var pw=document.getElementById('pw');
  pw.classList.toggle('on',!!run);
  pw.innerText=run?'⏻ 运行中':'⏻ 开机';
  var p=document.getElementById('pz');
  p.innerText=paused?'▶ 恢复运行':'⏸ 暂停';
  p.classList.toggle('rz',!!paused);
  document.getElementById('lock').style.display=auto?'block':'none';
  busy=0;
}

/* ============================================================ 发送指令（经巴法云 /set，与巴法APP 同一套命令主题） ============================================================ */
function publish(topic,msg){
  if(demo) return;
  if(client && client.connected) client.publish(topic+"/set", msg, {qos:0});
}
/* 日志指令专用：必须发到 xiwanjilog/set（巴法云规则：纯主题不推送，只有 /set 才推给订阅者） */
function pubLog(msg){
  if(demo||!client||!client.connected) return false;
  client.publish(TOPIC_LOG+"/set", msg, {qos:0});
  return true;
}
function doPower(){
  if(busy) return; busy=1;
  if(demo){ var d=window.__demo; d.running=!d.running; setRemain(d.running?'剩余12分30秒':'待机'); return; }
  if(!ensureConnected()){ busy=0; return; }
  publish(TOPIC_CMD, run?"off":"on");
  run=!run; updateUI();
}
function doPause(){
  if(busy) return; busy=1;
  if(demo){ var d=window.__demo; d.paused=!d.paused;
    setRemain(d.running?(d.paused?'已暂停，剩余12分30秒':'剩余12分30秒'):'待机'); return; }
  if(!ensureConnected()){ busy=0; return; }
  publish(TOPIC_PAUSE, paused?"off":"on");
  paused=!paused; updateUI();
}
function toggle(i){
  if(auto||busy) return; busy=1;
  if(demo){ var d=window.__demo; d.ch[i]=!d.ch[i]; setCh(i,d.ch[i]); return; }
  if(!ensureConnected()){ busy=0; return; }
  publish(chTopic(i), ch[i]?"off":"on");
  ch[i]=!ch[i]; setCh(i,ch[i]);
}

/* ============================================================ UI 辅助 ============================================================ */
function showUidForm(tip){
  hideResetBtn();                 // 显示输入框时隐藏“换设备”按钮
  document.getElementById('uidbar').style.display='block';
  if(tip) document.getElementById('uidtip').innerText=tip;
  if(uid) document.getElementById('uid').value=uid;
}
function hideUidForm(){ document.getElementById('uidbar').style.display='none'; }

/* 已记住 UID 后，在标题栏显示“⟳ 换设备”入口，点它主动清除并重新弹框 */
function showResetBtn(){ var e=document.getElementById('resetUid'); if(e) e.style.display='inline-block'; }
function hideResetBtn(){ var e=document.getElementById('resetUid'); if(e) e.style.display='none'; }
function resetUid(){
  // 同时清空 localStorage 与 Cookie 两处备份
  try{ localStorage.removeItem(LSK); }catch(e){}
  try{ document.cookie = CK + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; SameSite=Lax'; }catch(e){}
  uid=''; hadUid=false;
  if(client){ try{ client.end(true); }catch(e){} client=null; }
  setDot(0);
  document.getElementById('net').innerText='公网';
  hideResetBtn();
  showUidForm('已清除保存的巴法云ID，请重新填写（仅此一次，之后自动记住）');
  document.getElementById('st').innerText='等待填写 ID';
}

/* 心跳保活：每30秒发一条轻量消息，防止运营商NAT/WebSocket空闲超时把连接静默掐断（“过几分钟就操作不了”的主因） */
var hbTimer=null;
function startHeartbeat(){
  if(hbTimer) clearInterval(hbTimer);
  hbTimer=setInterval(function(){
    if(client && client.connected){
      try{ client.publish("xiwanjihb", "1", {qos:0}); }catch(e){}
    }
  }, 30000);
}
/* 操作前检查连接：断了就提示并触发重连，避免“点了没反应” */
function ensureConnected(){
  if(client && client.connected) return true;
  setDot(3);
  document.getElementById('net').innerText='公网断开·重连中';
  document.getElementById('st').innerText='连接已断开，正在自动重连…';
  if(client){ try{ client.reconnect(); }catch(e){} }
  return false;
}

/* ============================================================ 连接：用 UID 作 ClientID 连巴法云 WebSocket ============================================================ */
function connectWith(id){
  uid=(id||'').trim();
  if(!uid){ showUidForm('请先填写巴法云 UID'); return; }
  if(client){ try{client.end(true);}catch(e){} client=null; }
  setDot(1);
  document.getElementById('st').innerText='正在连接云端…';

  client = mqtt.connect('wss://bemfa.com:9504/wss', {
    clientId: uid, clean:true, reconnectPeriod:3000, connectTimeout:8000,
    protocolVersion:4, keepalive:30, username:'', password:''
  });

  client.on('connect', function(){
    setDot(2);
    hideUidForm();                 // 一旦连上就隐藏输入框（已记住或刚填写）
    showResetBtn();                // 已连上 → 显示“换设备”清除入口
    document.getElementById('net').innerText='公网已连';
    // 订阅主题（固件已改成直接发布到基础主题，不带 /up）
    client.subscribe(TOPIC_STATUS,      {qos:0});
    client.subscribe(TOPIC_REMAIN,      {qos:0});
    client.subscribe(TOPIC_LOG,        {qos:0});
    for(var i=0;i<8;i++){ var t=chTopic(i); client.subscribe(t,{qos:0}); }
    document.getElementById('st').innerText='已连接，等待设备数据…';
    startHeartbeat();              // 启动应用层心跳，防止空闲被掐断
    
    // 同步网页时间给ESP32（解决NTP同步失败问题）—— 必须发 /set 才会推送到设备
    var ts = Math.floor(new Date().getTime() / 1000);
    client.publish(TOPIC_LOG+'/set', 'time:' + ts, {qos:0});
    console.log('已同步时间给ESP32:', ts);
    
    // 8 秒后判定：本就没UID(首次)→弹输入框；已记住UID→只提示可能离线，绝不弹框
    setTimeout(function(){
      if(client && client.connected && document.getElementById('remain').innerText==='-- --'){
        if(!hadUid){
          showUidForm('云端已连上，但没收到设备数据：请核对 UID 是否正确、设备是否已联网');
          setDot(3);
        } else {
          document.getElementById('st').innerText='云端已连，但设备暂无数据（设备可能离线）';
          setDot(3);
        }
      }
    }, 8000);
  });

  client.on('message', function(topic, payload){
    var s=payload.toString();
    var base=baseTopic(topic);
    // 调试：显示收到的所有消息
    var dbg=document.getElementById('debug');
    if(dbg){
      dbg.innerHTML = '收到: ' + topic + ' = ' + s + '<br>' + dbg.innerHTML;
      if(dbg.innerHTML.length>500) dbg.innerHTML=dbg.innerHTML.slice(0,500);
    }
    if(base===TOPIC_REMAIN){ setRemain(s); setDot(2); }
    else if(base===TOPIC_STATUS){ document.getElementById('st').innerText=s; }
    else if(base===TOPIC_LOG){ handleLogMessage(s); }
    else if(base in chBase){ setCh(chBase[base], s==='on'); }
  });

  client.on('reconnect', function(){ setDot(1); document.getElementById('net').innerText='公网·重连中'; });
  client.on('close',      function(){
    setDot(0);
    document.getElementById('net').innerText='公网断开·重连中';
    document.getElementById('st').innerText='连接已断开，正在自动重连…';
  });
  client.on('error',      function(e){ console.log('mqtt error', e); setDot(3); document.getElementById('st').innerText='连接出错，正在重连…'; });
}

function manualConnect(){
  var v=document.getElementById('uid').value.trim();
  if(!v){ alert('请先填写巴法云 UID'); return; }
  hadUid=true;          // 用户主动连接过 → 之后不再弹输入框
  saveUid(v);           // 立即永久记住，下次自动连接
  connectWith(v);
}

/* ============================================================ 启动 ============================================================ */
function boot(){
  if(location.search.indexOf('demo')>=0){ enableDemo(); return; }

  if(typeof mqtt==='undefined'){
    showUidForm('MQTT 组件加载失败：请联网后刷新页面重试');
    document.getElementById('st').innerText='组件加载失败';
    return;
  }

  // 已记住 UID → 自动连接，隐藏输入框（绝不弹出）
  var saved=loadUid();
  if(saved){
    uid=saved; hadUid=true;
    document.getElementById('st').innerText='已记住ID，正在自动连接…';
    connectWith(saved);
    return;
  }

  // 首次使用（UID 为空）→ 显示输入框，让客户粘贴
  showUidForm('首次使用，请填写一次巴法云 UID（之后自动记住，无需再填）');
  document.getElementById('st').innerText='等待填写 ID';
}

/* ============================================================ 演示模式（?demo=1） ============================================================ */
function enableDemo(){
  demo=true; hideUidForm(); setDot(2);
  document.getElementById('net').innerText='演示';
  window.__demo={running:true,paused:false,ch:[1,0,1,1,0,1,0,0]};
  for(var i=0;i<8;i++) setCh(i, window.__demo.ch[i]);
  setRemain('剩余12分30秒');
  var total=750;
  setInterval(function(){
    var d=window.__demo;
    if(d.paused||!d.running) return;
    total--; if(total<0) total=0;
    var m=Math.floor(total/60), s=total%60;
    setRemain('剩余'+('0'+m).slice(-2)+'分'+('0'+s).slice(-2)+'秒');
  },1000);
}

/* ============================================================ 日历日志功能 ============================================================ */
var calYear, calMonth;
var logDates = {};  // 有日志的日期集合，key 是 YYYYMMDD
var currentLogContent = "";
var currentSelectedDate = "";
var logListGot = false;   // 是否收到过设备回传的 LIST（用于诊断：区分“固件没响应”还是“确实没日志”）
var autoOpenedToday = false;  // 本次打开弹窗是否已自动加载当天日志
var logQueryCount = 0;        // 已向设备查询日志列表的次数（用于诊断）
var logRetryTimer = null;     // 查询重试定时器

// 处理日志消息
function handleLogMessage(s) {
  if(!s) return;
  if(s.startsWith("DIAG:")){
    var d = s.substring(5);
    var el = document.getElementById('logDiag');
    if(el){
      el.style.color = '#0a7d29';
      el.style.background = '#eafaf0';
      el.innerText = '🔧 设备诊断：' + d
        + '\n(mount=1文件系统已挂载 · files=日志天数 · todayLen=今天日志字节数 · synced=1时间已校准)';
    }
    return;
  }
  if(s.startsWith("TIME_OK:")){
    // 时间校验成功，静默忽略（可自行打 console）
    return;
  }
  if(s.startsWith("LIST:")){
    var dates = s.substring(5).trim();
    logListGot = true;   // 收到设备回传，说明固件是新版且在线
    updateLogDiag();     // 同步诊断条
    logDates = {};
    if(dates){
      var arr = dates.split(",");
      for(var i=0;i<arr.length;i++){
        var d=arr[i].trim();
        if(d) logDates[d] = true;
      }
    }
    renderCalendar();
    // 列表返回后：若用户还没手动点日期，自动加载【今天】的日志
    var today = todayYmd();
    if(!autoOpenedToday){
      autoOpenedToday = true;
      if(logDates[today]){
        selectDate(today);          // 今天有记录 → 直接摊开当天日志
      }else{
        document.getElementById('logContent').innerText =
          dates ? "今天还没有日志记录\n\n蓝色日期表示当天有记录，点击即可查看"
                : "设备暂无历史日志（可能尚未产生记录或时间未同步）";
      }
    }
    return;
  }
  if(s.startsWith("LOG:")){
    var body = s.substring(4);
    if(body === "END"){
      // 日志接收完成
      document.getElementById('logContent').innerText =
        currentLogContent || (currentSelectedDate + " 当天没有日志记录");
      return;
    }
    currentLogContent += body + "\n";
    // 实时显示，边收边看
    document.getElementById('logContent').innerText = currentLogContent;
    return;
  }
}

// 今天的 YYYYMMDD（用手机本地时间，与设备同步后的日期一致）
function todayYmd(){
  var n = new Date();
  return "" + n.getFullYear() + ("0"+(n.getMonth()+1)).slice(-2) + ("0"+n.getDate()).slice(-2);
}

// 诊断条：根据当前状态显示查询进度
function updateLogDiag(){
  var el = document.getElementById('logDiag');
  if(!el) return;
  if(logListGot){
    el.style.color = '#0a7d29';
    el.style.background = '#eafaf0';
    el.innerText = '✅ 已收到设备回传（共查询 ' + logQueryCount + ' 次）';
  } else {
    el.style.color = '#b26a00';
    el.style.background = '#fff8e1';
    el.innerText = '⏳ 正在向设备查询日志…（已发 ' + logQueryCount + ' 次）';
  }
}

// 单次查询：同步时间 + 拉取日期列表
function queryLogOnce(){
  if(!(client && client.connected)) return;
  var nowTs = Math.floor(new Date().getTime() / 1000);
  client.publish(TOPIC_LOG+'/set', 'time:' + nowTs, {qos:0});   // 同步时间给设备
  pubLog("list");                                                // 查询日志列表
  logQueryCount++;
  updateLogDiag();
}

// 多次查询仍无回传：给出具体排查指引
function showLogNoReply(){
  document.getElementById('logContent').innerText =
    "⚠ 已多次向设备查询，但未收到任何回传。请排查：\n"+
    "① ESP32 是否在线（看屏幕剩余时间/状态能否正常刷新）\n"+
    "② 是否烧录了【含日志功能】的最新固件（串口应打印『日志系统 SPIFFS 挂载成功』，\n"+
    "   以及『NTP校时成功』或『网页时间同步成功』）\n"+
    "③ 巴法云 UID 是否正确；网页与设备是否共用同一 UID 导致互相踢下线\n"+
    "④ 看页面下方【绿色调试框】：若完全没有任何 xiwanjilog 开头的消息，说明命令没到设备\n"+
    "   —— 这种情况建议改用「HTTP 接口」方式控制（不抢 UID 连接）";
}

// 打开日历
function openCalendar(){
  var now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
  currentLogContent = "";
  currentSelectedDate = todayYmd();     // 默认选中今天
  logListGot = false;
  autoOpenedToday = false;
  logQueryCount = 0;
  document.getElementById('logContent').innerText = "正在加载日志列表...";
  document.getElementById('calendarModal').style.display = 'flex';
  renderCalendar();
  updateLogDiag();
  if(client && client.connected){
    // 先发一次诊断命令：设备回传 SPIFFS 挂载/空间/文件数，用于一眼定位日志为何为空
    setTimeout(function(){ pubLog("diag"); }, 300);
    // 立即查一次，之后每 1.2 秒重试，最多 5 次：
    //   —— 抗偶发丢包；也对抗「网页与设备共用 UID 互相踢下线」时的短暂离线窗口
    queryLogOnce();
    if(logRetryTimer) clearInterval(logRetryTimer);
    logRetryTimer = setInterval(function(){
      if(logListGot || logQueryCount >= 5){
        clearInterval(logRetryTimer); logRetryTimer = null;
        if(!logListGot) showLogNoReply();
        return;
      }
      queryLogOnce();
    }, 1200);
  } else {
    document.getElementById('logContent').innerText = "MQTT未连接，请稍后再试";
  }
}

// 关闭日历
function closeCalendar(){
  document.getElementById('calendarModal').style.display = 'none';
}

// 上个月
function prevMonth(){
  calMonth--;
  if(calMonth < 0){ calMonth = 11; calYear--; }
  renderCalendar();
}

// 下个月
function nextMonth(){
  calMonth++;
  if(calMonth > 11){ calMonth = 0; calYear++; }
  renderCalendar();
}

// 渲染日历
function renderCalendar(){
  document.getElementById('calendarTitle').innerText = calYear + "年" + (calMonth+1) + "月";
  var firstDay = new Date(calYear, calMonth, 1).getDay();  // 当月第一天是星期几
  var daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  var today = todayYmd();

  var html = "";
  // 前面的空格
  for(var i=0;i<firstDay;i++){
    html += '<div style="padding:8px;"></div>';
  }

  // 日期：有日志 → 蓝底白字；今天 → 蓝框；选中 → 白圈加亮
  for(var d=1; d<=daysInMonth; d++){
    var ymd = "" + calYear + ("0"+(calMonth+1)).slice(-2) + ("0"+d).slice(-2);
    var hasLog = !!logDates[ymd];
    var isToday = (ymd === today);
    var isSel = (ymd === currentSelectedDate);

    var bg = hasLog ? 'linear-gradient(180deg,#3b82f6,#2563eb)' : '#f3f4f6';
    var color = hasLog ? '#ffffff' : '#333333';
    var border = isToday ? '2px solid #1d4ed8' : '1px solid ' + (hasLog ? '#2563eb' : '#e5e7eb');
    var shadow = isSel ? 'box-shadow:0 0 0 2px #ffffff,0 0 0 4px #2563eb;' : '';
    var weight = hasLog ? 'bold' : 'normal';

    html += '<div onclick="selectDate(\''+ymd+'\')" style="padding:8px 0;border-radius:10px;cursor:pointer;'
          + 'background:'+bg+';color:'+color+';border:'+border+';font-weight:'+weight+';font-size:14px;'
          + shadow + '">' + d + '</div>';
  }

  document.getElementById('calendarDays').innerHTML = html;
}

// 选择日期，查询日志
function selectDate(ymd){
  currentSelectedDate = ymd;      // 记住选中，日历会高亮该日
  currentLogContent = "";
  renderCalendar();               // 立即刷新高亮，给出点击反馈
  document.getElementById('logContent').innerText = "正在加载 " + ymd + " 的日志...";
  if(client && client.connected){
    pubLog("date:" + ymd);
    // 1.5 秒后若仍在加载（没收到回传），重发一次，对抗偶发丢包
    setTimeout(function(){
      if(document.getElementById('logContent').innerText.indexOf('正在加载') === 0){
        pubLog("date:" + ymd);
      }
    }, 1500);
  } else {
    document.getElementById('logContent').innerText = "MQTT未连接，请稍后再试";
  }
}

boot();

/* ================= 每3分钟自动刷新页面（重新连接、重新提交，恢复正常） ================= */
setTimeout(function(){ location.reload(); }, 3 * 60 * 1000);
</script>
